name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build static export
        # NEXT_PUBLIC_BASE_PATH must be set HERE, not just in next.config.
        # It is read at build time and inlined into the client bundle; if it is
        # missing the build still succeeds and silently falls back to "", and
        # every asset 404s on the project URL. Verify by grepping the shipped
        # bundle for the prefix, not by trusting a green build.
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: Disable Jekyll
        # Without this, Pages runs the output through Jekyll, which drops every
        # directory beginning with an underscore — including _next. The site
        # would deploy "successfully" and render completely unstyled.
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
